[tool.uv.workspace]
members = ["services/catalog"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-django",
    "factory-boy",
    "pre-commit",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations/**"]  # generated by Django

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names...
    "I",       # isort: import order
    "B",       # bugbear: common bugs
    "UP",      # pyupgrade: modern syntax for our Python version
    "DJ",      # flake8-django: Django-specific mistakes
    "RUF",     # ruff's own rules
]
ignore = [
    "RUF012",  # Django/DRF configure classes with list attributes (Meta.fields...)
    "E501",    # line length: the formatter handles it; long strings cannot be split
]

[tool.ruff.lint.isort]
known-first-party = ["config", "accounts", "events"]
