[tool.uv.workspace]
members = ["services/catalog", "services/booking"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-django",
    "factory-boy",
    "pre-commit",
    "pytest-cov>=7.1.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["**/migrations/**"]  # generated by Django

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names...
    "I",       # isort: import order
    "B",       # bugbear: common bugs
    "UP",      # pyupgrade: modern syntax for our Python version
    "DJ",      # flake8-django: Django-specific mistakes
    "RUF",     # ruff's own rules
]
ignore = [
    "RUF012",  # Django/DRF configure classes with list attributes (Meta.fields...)
    "E501",    # line length: the formatter handles it; long strings cannot be split
]

[tool.ruff.lint.isort]
known-first-party = ["config", "accounts", "events", "booking"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/catalog:services/booking"
explicit_package_bases = true
exclude = ["/migrations/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
# Gradual typing: check the body of every function, typed or not...
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true
# ...but don't force annotations everywhere yet (tighten later with disallow_untyped_defs).

[[tool.mypy.overrides]]
# New code, so it starts strict: every function must be fully annotated.
module = ["booking.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["django_filters.*"]
ignore_missing_imports = true  # this package ships no type information

[[tool.mypy.overrides]]
# factory-boy doesn't type `EventFactory()` as returning an Event, so mypy sees a
# factory object. Silence only those two error codes; everything else is checked.
module = ["tests.*"]
disable_error_code = ["attr-defined", "misc"]

[tool.django-stubs]
django_settings_module = "config.settings"
