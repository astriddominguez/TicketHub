# Prometheus pulls ("scrapes") /metrics from every process every few seconds.
# During development the services run on the host, hence localhost.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ["localhost:8000"]
  - job_name: booking-api
    static_configs:
      - targets: ["localhost:8001"]
  - job_name: booking-consumer
    static_configs:
      - targets: ["localhost:9101"]
