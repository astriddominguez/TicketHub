# TicketHub gateway: the single public entry point. The SAME file is used by
# docker compose (http://localhost:8080) and by the Helm chart on kind
# (http://localhost:8090, via infra/k8s/charts/tickethub/files/nginx.conf).
#   /booking/*  -> booking service (FastAPI)
#   /*          -> catalog service (Django: API, admin, docs)

# Keep a few connections open to each service and reuse them (keep-alive),
# instead of a new TCP connection per request.
upstream catalog {
    server catalog:8000;
    keepalive 16;
}
upstream booking {
    server booking:8001;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;            # don't advertise the nginx version
    client_max_body_size 1m;      # this API never needs big uploads

    proxy_http_version 1.1;
    proxy_set_header Connection "";        # required for upstream keep-alive
    proxy_set_header Host $http_host;      # Django checks it (ALLOWED_HOSTS, CSRF)
    proxy_set_header X-Forwarded-Proto $scheme;
    # SET, don't append: whatever X-Forwarded-For the client sent is discarded,
    # so it can't pretend to be another IP to dodge the login throttle.
    proxy_set_header X-Forwarded-For $remote_addr;
    # One id per request, created here and logged by the services.
    proxy_set_header X-Request-ID $request_id;

    # Metrics are for Prometheus on the internal network, not for the internet.
    location = /metrics         { return 404; }
    location = /booking/metrics { return 404; }

    # Strip the /booking prefix (the trailing "/" in proxy_pass does it): booking
    # serves its routes at the root. Uvicorn runs with --root-path /booking, so the
    # app still knows its public prefix (the docs link to /booking/openapi.json).
    location /booking/ {
        proxy_pass http://booking/;
    }

    location / {
        proxy_pass http://catalog;
    }
}
