[project]
name = "booking"
version = "0.1.0"
description = "TicketHub booking service: temporary reservations without double selling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery>=5.5",
    "fastapi>=0.142.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-asyncpg>=0.66b0",
    "opentelemetry-instrumentation-celery>=0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "qrcode[pil]>=8.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
# One event loop for the whole run: the SQLAlchemy engine's connections belong to it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["booking"]
# SQLAlchemy's async layer runs our code inside greenlets: trace them too.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80  # the project's success criterion; CI fails below it
