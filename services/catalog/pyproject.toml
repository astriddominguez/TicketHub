[project]
name = "catalog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Astrid", email = "dominguezcastellanoastrid@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-django>=0.66b0",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --reuse-db"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "tests/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80  # the project's success criterion; CI fails below it
